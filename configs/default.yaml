# Default ttt-kernel config.
# Override any field on the CLI:  python scripts/inference.py --config configs/default.yaml model.name=Qwen/Qwen3-4B

model:
  name: Qwen/Qwen3-4B-Thinking-2507
  dtype: bfloat16
  trust_remote_code: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Module patterns to apply LoRA on. Qwen3 attention + MLP projections.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"

sglang:
  base_url: http://127.0.0.1:30000
  # Adapter directory mounted into SGLang at --lora-paths ttt=/.../adapter
  adapter_name: ttt
  # Path the trainer writes the adapter to (must match what SGLang was launched with)
  adapter_out_dir: ./adapters/ttt
  # Endpoint that hot-reloads the adapter weights (SGLang >= 0.4)
  update_weights_endpoint: /update_weights_from_disk

rollout:
  num_samples: 8        # K parallel attempts per problem per turn
  max_tokens: 16384
  temperature: 1.0
  top_p: 0.95

kernelbench:
  # Path to the cloned KernelBench repo (also overridable via KERNELBENCH_PATH env var)
  repo_path: /weka/scratch/schmidt/ssci-aviralku/asetlur/KernelBench
  dataset_src: huggingface
  dataset_name: ScalingIntelligence/KernelBench
  level: 1
  problem_ids: null   # null = all problems in the level; otherwise list, e.g. [1, 2, 3]
  backend: cuda
  precision: fp32
  gpu_arch: Blackwell
  prompt_option: one_shot
  num_correct_trials: 5
  num_perf_trials: 100
  timing_method: cuda_event
  # Hard wall-clock budget per single rollout eval (seconds). Bad kernels can hang.
  eval_timeout_s: 120

reward:
  # Maps (compiled, correct, speedup) -> scalar reward.
  # speedup > 1: positive (favored); speedup < 1: negative; any error: negative.
  speedup_log_scale: true   # use log(speedup) so 2x and 0.5x are symmetric
  error_penalty: -1.0
  incorrect_penalty: -1.0
  # Clip rewards to [-clip, clip] before normalization
  clip: 2.0

grpo:
  beta_kl: 0.04                # KL coeff to reference (frozen base + frozen adapter snapshot)
  epsilon_clip: 0.2            # PPO-style importance-sampling clip
  group_advantage_norm: true   # subtract group mean / divide by group std
  update_epochs: 1             # gradient passes per turn over the K rollouts
  learning_rate: 1.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  micro_batch_size: 1          # per-device batch for the policy forward pass
  max_seq_len: 8192            # truncate the (prompt + completion) for the loss pass

loop:
  num_turns: 5                 # multi-turn online RL: turns per problem
  # If true, keep the adapter learned on problem N when starting problem N+1.
  # If false, reset to the base model at the start of each problem.
  persist_adapter_across_problems: false
  seed: 0

logging:
  out_dir: ./runs
  run_name: null               # auto: ttt_<timestamp>
  log_every: 1
  save_adapter_every_turn: true
